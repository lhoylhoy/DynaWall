<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d1117" />
    <meta
      name="description"
      content="DynaWall — a minimalist, time-aware live wallpaper for macOS, Lively Wallpaper and Wallpaper Engine."
    />
    <title>DynaWall</title>

    <!--
      Strict Content Security Policy, delivered as a meta tag because every host
      loads this page straight from disk or from a folder mapping (there is no
      server that could send a header).

        default-src 'none'          nothing loads unless a directive below says so
        script-src 'self' file:     only the bundled script.js — the native hosts
                                    evaluate their own JS out of band, which CSP
                                    does not (and must not) police
        style-src 'self' file:      style.css, plus 'unsafe-inline' for the CSS the
          'unsafe-inline'           hosts inject while live-editing settings
        font-src 'self' file: data: the four vendored faces and an imported font,
                                    which travels as a data: URL
        img-src ... dynawall-photo: the bundled pictures, the user's folder behind
                                    the macOS scheme handler, and the two WebView2
                                    virtual hosts (dynawall.local = the page itself,
                                    dynawall-photos.local = a chosen folder). The
                                    favicon hosts are the one remote exception: an
                                    app outside the curated catalogue loads its own
                                    site's mark from Google's favicon service (and
                                    the CDNs it redirects to) or DuckDuckGo's, which
                                    is then keyed out to a white glyph. The macOS
                                    host fetches the same mark natively instead, so
                                    this list only matters to browser hosts.
        connect-src 'self'           nothing: the wallpaper fetches no remote host at
                                    all. Every app it launches is handed to the OS
                                    browser, so no request ever leaves this page
        base-uri / form-action      neither can be retargeted by injected markup

      `file:` is what keeps the macOS bundle working: its WKWebView loads this file
      over file://, where `'self'` resolves to an opaque origin in some WebKit
      versions. frame-ancestors is deliberately absent — browsers ignore it in a
      meta tag, and nothing ever frames the wallpaper (default-src 'none' blocks it).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; font-src 'self' file: data:; img-src 'self' file: data: blob: dynawall-photo: https://dynawall.local https://dynawall-photos.local https://www.google.com https://t0.gstatic.com https://t1.gstatic.com https://t2.gstatic.com https://t3.gstatic.com https://icons.duckduckgo.com; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <!-- The wallpaper never needs to tell a remote server where it came from. -->
    <meta name="referrer" content="no-referrer" />

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="wallpaper-container" aria-label="DynaWall live wallpaper">
      <!-- Background photos: two layers cross-fade so slides never flash -->
      <div class="photo-stack" id="photos" aria-hidden="true">
        <img class="photo" id="photo-a" alt="" decoding="async" />
        <img class="photo" id="photo-b" alt="" decoding="async" />
      </div>

      <!-- Darkens the photo just enough for the greeting to stay readable -->
      <div class="scrim" aria-hidden="true"></div>

      <div class="wallpaper-content" id="content">
        <!-- Fallback copy is swapped for the time-aware greeting on load -->
        <h1 class="greeting" id="greeting">Good day, Developer.</h1>

        <p class="subtitle" id="subtitle">What are we building today?</p>
      </div>

      <!-- White satellites, thrown into a loose ring around the greeting by script.js.
           They are bare glyphs: no circle, no plate, no shadow of their own — the icon
           is the whole button. They are a sibling of the text block rather than a child
           of it: an absolutely positioned child would be measured against the greeting —
           including its entrance transform — instead of against the screen.

           One satellite ships here: the `+` that opens the Apps card, which is how the
           user adds, launches and forgets their own apps. script.js adds one more
           satellite per app the user keeps (GitHub, ChatGPT, …), all dealt the same
           hand. The orbit itself is pointer-transparent, so only the buttons are hit
           targets — script.js measures them and tells the native host where the cursor
           may click, which is what keeps the rest of the desktop on the Finder
           (drag-select, right-click, Mission Control). -->
      <nav class="widget-orbit" id="widget-bar" aria-label="Desktop apps">
        <button
          type="button"
          class="widget-btn widget-btn-add"
          id="widget-btn-add"
          title="Add an app"
          aria-label="Add an app"
          aria-haspopup="dialog"
          aria-controls="widget-modal"
          aria-expanded="false"
        >
          <!-- The one control that is not an app: a bare `+`, drawn in the same ink and
               at the same weight as the brand marks it adds to the ring. -->
          <svg class="widget-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </nav>

      <!-- Frosted-glass widget viewport. Always in the DOM, only visible once a
           satellite is pressed: `aria-hidden` and `visibility: hidden` keep the
           closed card out of the accessibility tree and out of the tab order. -->
      <div class="widget-backdrop" id="widget-backdrop" aria-hidden="true">
        <div
          class="widget-modal"
          id="widget-modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="widget-modal-title"
          aria-describedby="widget-modal-caption"
          tabindex="-1"
        >
          <header class="widget-modal-header">
            <!-- The card is the apps manager and nothing else, so its badge is the same
                 `+` the satellite wears: the glyph the user pressed is the glyph the
                 card is titled with. -->
            <span class="widget-modal-badge" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </span>
            <div class="widget-modal-heading">
              <h2 class="widget-modal-title" id="widget-modal-title">Apps</h2>
              <p class="widget-modal-caption" id="widget-modal-caption">
                Desktop shortcuts and launchers
              </p>
            </div>
            <button type="button" class="widget-modal-close" id="widget-modal-close" aria-label="Close apps">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
            </button>
          </header>

          <div class="widget-modal-body" id="widget-modal-body"></div>
        </div>
      </div>
    </main>
  </body>
</html>
