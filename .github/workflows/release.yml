name: Release

# Two download channels:
#
#   push to main  -> refreshes the rolling "nightly" pre-release, so there is
#                    always an installer at a stable URL
#   push a v* tag -> publishes a stable release (that is what /releases/latest
#                    points at) with the same three files attached
#
# Run it manually from the Actions tab to refresh the nightly build.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Serialise runs per ref: two pushes to main must not clobber the nightly
# release at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the wallpaper
        run: node tests/verify.cjs

      - name: Build DynaWall.dmg
        run: ./build-dmg.sh

      - name: Verify the disk image
        run: |
          hdiutil verify dist/DynaWall.dmg
          codesign --verify --verbose=2 dist/DynaWall.dmg
          # Universal 2 or nothing: an arm64-only DMG cannot run on an Intel Mac
          # (Rosetta 2 translates x86_64 → arm64, never the other way round).
          archs="$(lipo -archs dist/DynaWall.app/Contents/MacOS/DynaWall)"
          echo "DynaWall.app architectures: $archs"
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "error: the $arch slice is missing from the app bundle" >&2; exit 1 ;;
            esac
          done

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: DynaWall-macOS
          path: dist/DynaWall.dmg
          if-no-files-found: error

  windows:
    name: Windows portable + installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Verify the wallpaper
        run: node tests/verify.cjs

      - name: Build DynaWall.exe, portable zip and setup
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { "0.0.$env:RUN_NUMBER" }
          ./windows/build-release.ps1 -Version $version

      - name: Verify the Windows builds
        shell: pwsh
        run: |
          # The portable zip and standalone exe must be runnable on their own.
          if (-not (Test-Path 'dist/DynaWall.exe')) { throw 'standalone DynaWall.exe was not produced' }
          if (-not (Test-Path 'dist/DynaWall-Setup.exe')) { throw 'DynaWall-Setup.exe was not produced' }
          if (-not (Test-Path 'dist/DynaWall-Windows-Portable.zip')) { throw 'DynaWall-Windows-Portable.zip was not produced' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = (Resolve-Path 'dist/DynaWall-Windows-Portable.zip').Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
            $required = @(
              'DynaWall.exe',
              'web/index.html',
              'web/script.js',
              'web/style.css',
              'web/assets/fonts/outfit-latin.woff2'
            )
            foreach ($entry in $required) {
              if ($names -notcontains $entry) { throw "the portable zip is missing $entry" }
            }
            Write-Host "portable zip OK: $($names.Count) entries"
          } finally {
            $archive.Dispose()
          }

      - name: Upload the Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: DynaWall-Windows
          path: |
            dist/DynaWall.exe
            dist/DynaWall-Setup.exe
            dist/DynaWall-Windows-Portable.zip
          if-no-files-found: error

  publish:
    name: Publish the downloads
    needs: [macos, windows]
    # Publish whatever did build: a Windows hiccup must not hide the macOS DMG.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA-256 checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cd dist
          # One line per installer that actually built, in the same format `sha256sum
          # --check` and `shasum -a 256 --check` both accept, so a download can be
          # verified without trusting the release page.
          : > SHA256SUMS.txt
          for asset in DynaWall.dmg DynaWall.exe DynaWall-Setup.exe DynaWall-Windows-Portable.zip; do
            if [ -f "$asset" ]; then
              sha256sum "$asset" >> SHA256SUMS.txt
            else
              echo "warning: $asset did not build; it is left out of the checksums" >&2
            fi
          done
          if [ ! -s SHA256SUMS.txt ]; then
            # No installer survived the build jobs: publish nothing rather than an
            # empty checksum file that would make dist/ look populated.
            echo "warning: nothing to checksum" >&2
            rm -f SHA256SUMS.txt
            exit 0
          fi
          cat SHA256SUMS.txt

      - name: Attach the installers to a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A checksum file alone is not a release: require at least one installer.
          found=0
          for asset in DynaWall.dmg DynaWall.exe DynaWall-Setup.exe DynaWall-Windows-Portable.zip; do
            if [ -f "dist/$asset" ]; then found=1; fi
          done
          if [ "$found" -eq 0 ]; then
            echo "error: no installers reached the publish job" >&2
            exit 1
          fi
          ls -l dist

          # A version tag publishes a stable release; /releases/latest points here.
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/* --clobber
            else
              gh release create "$TAG" dist/* --title "DynaWall $TAG" --generate-notes
            fi
          else
            # Everything else refreshes one rolling pre-release: the tag and the asset
            # names stay put, so these URLs are always live.
            TAG=nightly
            NOTES="Latest build of $REF_NAME at $SHA.

          - macOS 12+ (Universal 2: Apple silicon + Intel): DynaWall.dmg
          - Windows 10/11 x64: DynaWall-Setup.exe or DynaWall-Windows-Portable.zip
          - SHA256SUMS.txt: sha256 of every installer above

          Every push to main replaces these files. Versioned releases live under the v* tags."

            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "Latest build" --notes "$NOTES"
              gh release upload "$TAG" dist/* --clobber
            else
              gh release create "$TAG" dist/* --target "$SHA" --prerelease \
                --title "Latest build" --notes "$NOTES"
            fi
          fi

          # Put the download links on the workflow run page as well.
          {
            echo "### Installers"
            echo
            echo "- macOS 12+ (Universal 2: Apple silicon + Intel): https://github.com/$GH_REPO/releases/download/$TAG/DynaWall.dmg"
            echo "- Windows standalone: https://github.com/$GH_REPO/releases/download/$TAG/DynaWall.exe"
            echo "- Windows setup: https://github.com/$GH_REPO/releases/download/$TAG/DynaWall-Setup.exe"
            echo "- Windows portable: https://github.com/$GH_REPO/releases/download/$TAG/DynaWall-Windows-Portable.zip"
            echo "- Checksums: https://github.com/$GH_REPO/releases/download/$TAG/SHA256SUMS.txt"
            echo
            echo "Verify a download with \`shasum -a 256 --check SHA256SUMS.txt\` (macOS) or \`certutil -hashfile <file> SHA256\` (Windows)."
            echo
            echo "Release page: https://github.com/$GH_REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
